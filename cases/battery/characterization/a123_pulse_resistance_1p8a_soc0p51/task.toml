schema_version = "1.3"
artifacts = ["/tmp/agent/submission"]

[task]
name        = "hwe-bench/a123-pulse-resistance-1p8a-soc0p51"
description = "pulse resistance measurement of the Prada2013 cell, scored from an evaluator-reproduced pulse simulation."
authors     = [{name = "SVD AI Lab"}]
keywords    = ["battery", "pybamm", "lithium-ion", "electrochemistry", "pulse"]

[environment]
docker_image    = "sim-benchmark-battery-fullstack:latest"
cpus            = 2
memory_mb       = 4096
storage_mb      = 4096
gpus            = 0
# Harbor's docker provider refuses to ENFORCE "no-network" and aborts the run
# rather than downgrading, so declaring it makes the case unrunnable. The
# verifier container is still isolated: tests/docker-compose.yaml gives it
# network_mode: none.
network_mode    = "public"

[agent]
timeout_sec = 1800
user        = "agent"

[verifier]
timeout_sec      = 780
user             = "agent"
environment_mode = "separate"

[verifier.environment]
cpus         = 2
memory_mb    = 4096
storage_mb   = 4096
gpus         = 0
# Harbor's docker provider refuses to ENFORCE "no-network" and aborts the run
# rather than downgrading, so declaring it makes the case unrunnable. The
# verifier container is still isolated: tests/docker-compose.yaml gives it
# network_mode: none.
network_mode = "public"

[metadata.sim]
task_id           = "a123-pulse-resistance-1p8a-soc0p51"
solver            = "pybamm"
# Measured cost of producing the reference answer: solution/solve.sh plus the
# evaluator's clean reproduction, one core, on the domain image. Recorded so a
# case's price is legible before anyone schedules a sweep -- roughly half of it
# is a single solve, and an agent pays that once per attempt.
oracle_wall_sec   = 10
source_type       = "tutorial"
source_channel    = "tutorial-variant"
difficulty_tier   = "L"
gt_type           = "high-fidelity-solver"
release_status    = "public_runnable"
oracle_status     = "available"
runtime_status    = "oracle_calibrated_local_tolerance_study"
score_template    = "numerical"
leakage_risk      = 2
capability_target = "physics"
source_citation   = "Prada, Di Domenico, Creff et al., J. Electrochem. Soc. 160 (2013) A645 — A123 26650 LiFePO4/graphite cell, distributed with PyBaMM as the Prada2013 parameter set"
source_url        = "https://docs.pybamm.org/en/latest/source/examples/notebooks/models/simulating-ORegan-2022-parameter-set.html"
tags              = ["battery", "pybamm", "numeric-kpi", "native-reproduction", "ocv-gated"]
prototype_origin  = "pybamm:docs/source/examples/notebooks/models/simulating-ORegan-2022-parameter-set.ipynb"
prototype_delta   = "The example is not in the image -- the installed PyBaMM package ships no example tree at all, only the parameter sets -- so the collision is with the upstream repository and the rendered documentation page, not with a file the container holds. PyBaMM publishes no pulse-resistance example: searching its example scripts and its notebooks for one returns the GITT titration script (examples/scripts/experimental_protocols/gitt.py), whose current step lasts an hour and which reports no resistance, so this family's collision is with the notebook's numerics rather than with any published protocol. Moved: the protocol is a rest, a short discharge step and a relaxation, applied at a mid-plateau state of charge that is not a round number, and the current is sized to the cell rather than taken from an example. Redefined: the reported quantity is the instantaneous voltage step across the current step divided by that step, which neither the notebook nor the GITT script computes. Replaced: the deliverable is the results.csv output interface this benchmark grades. Kept, deliberately: the notebook's own numerics -- its var_pts dict, its exponential particle submesh refined toward the particle surface, and its IDAKLU solver -- so the perturbation is in the operating point, not in the numerics."
