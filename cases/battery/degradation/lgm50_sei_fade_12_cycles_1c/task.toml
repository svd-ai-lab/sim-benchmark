schema_version = "1.3"
artifacts = ["/tmp/agent/submission"]

[task]
name        = "hwe-bench/lgm50-sei-fade-12-cycles-1c"
description = "cycle ageing of the OKane2022 cell, scored from an evaluator-reproduced cycling simulation."
authors     = [{name = "SVD AI Lab"}]
keywords    = ["battery", "pybamm", "lithium-ion", "electrochemistry", "cycling"]

[environment]
docker_image    = "sim-benchmark-battery-fullstack:latest"
cpus            = 2
memory_mb       = 4096
storage_mb      = 4096
gpus            = 0
network_mode    = "public"

[agent]
timeout_sec = 1800
user        = "agent"

[verifier]
timeout_sec      = 1080
user             = "agent"
environment_mode = "separate"

[verifier.environment]
cpus         = 2
memory_mb    = 4096
storage_mb   = 4096
gpus         = 0
# Harbor's Docker Desktop provider cannot use its nftables egress sidecar.
# tests/docker-compose.yaml still gives the verifier container network_mode: none.
network_mode = "public"

[metadata.sim]
task_id           = "lgm50-sei-fade-12-cycles-1c"
solver            = "pybamm"
# Measured cost of producing the reference answer: solution/solve.sh plus the
# evaluator's clean reproduction, one core, on the domain image. Recorded so a
# case's price is legible before anyone schedules a sweep -- roughly half of it
# is a single solve, and an agent pays that once per attempt.
oracle_wall_sec   = 21
source_type       = "tutorial"
source_channel    = "tutorial-variant"
difficulty_tier   = "L"
gt_type           = "high-fidelity-solver"
release_status    = "public_runnable"
oracle_status     = "available"
runtime_status    = "oracle_calibrated_local_tolerance_study"
score_template    = "numerical"
leakage_risk      = 2
capability_target = "physics"
source_citation   = "O'Kane, Ai, Madabattula et al., Phys. Chem. Chem. Phys. 24 (2022) 7909 — LG M50 degradation parameterisation (SEI, plating, cracking), distributed with PyBaMM as the OKane2022 parameter set"
source_url        = "https://docs.pybamm.org/en/latest/source/examples/notebooks/models/coupled-degradation.html"
tags              = ["battery", "pybamm", "numeric-kpi", "native-reproduction", "ocv-gated"]
prototype_origin  = "pybamm:docs/source/examples/notebooks/models/coupled-degradation.ipynb"
prototype_delta   = "The example is not in the image -- the installed PyBaMM package ships no example tree at all, only the parameter sets -- so the collision is with the upstream repository and the rendered documentation page, not with a file the container holds. Moved: the notebook cycles at one round rate between round voltage limits, while this case's rate, ambient temperature and cycle count are case parameters and the rate is not a round number; the discharge leads each cycle here instead of following a hold. Reduced: the notebook turns on five coupled mechanisms at once -- interphase growth, interphase growth on cracks, plating, porosity change and stress-driven loss of active material -- while this case activates only the interphase-growth law and, where the table says so, plating, so the reported fade is attributable to a named mechanism. Redefined: the reported quantity is the percentage loss between the first and the last cycle's discharge capacity, segmented out of the current trace; the notebook plots capacity lost per mechanism against throughput. Dropped: the notebook's opening and closing capacity-check steps, and its own electrode mesh, which is coarser across the electrodes than the one this case keeps. Replaced: the deliverable is the results.csv output interface this benchmark grades. Kept, deliberately: the notebook's degradation parameter set, its solvent-diffusion-limited interphase law and its partially reversible plating option where the table selects them, and the cycle expressed as a repeated tuple of experiment steps. Kept as well: the numerics of PyBaMM's own O'Regan parameter-set notebook -- its var_pts dict, its exponential particle submesh refined toward the particle surface, and its IDAKLU solver -- so the perturbation is in the operating point, not in the numerics."
