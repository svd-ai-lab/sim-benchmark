schema_version = "1.3"
artifacts = ["/tmp/agent/submission"]

[task]
name        = "hwe-bench/nca-graphite-discharge-0p93c-299k"
description = "constant-current discharge of the NCA_Kim2011 cell, scored from an evaluator-reproduced discharge simulation."
authors     = [{name = "SVD AI Lab"}]
keywords    = ["battery", "pybamm", "lithium-ion", "electrochemistry", "discharge"]

[environment]
docker_image    = "sim-benchmark-battery-fullstack:latest"
cpus            = 2
memory_mb       = 4096
storage_mb      = 4096
gpus            = 0
network_mode    = "public"

[agent]
timeout_sec = 1800
user        = "agent"

[verifier]
timeout_sec      = 780
user             = "agent"
environment_mode = "separate"

[verifier.environment]
cpus         = 2
memory_mb    = 4096
storage_mb   = 4096
gpus         = 0
# Harbor's Docker Desktop provider cannot use its nftables egress sidecar.
# tests/docker-compose.yaml still gives the verifier container network_mode: none.
network_mode = "public"

[metadata.sim]
task_id           = "nca-graphite-discharge-0p93c-299k"
solver            = "pybamm"
# Measured cost of producing the reference answer: solution/solve.sh plus the
# evaluator's clean reproduction, one core, on the domain image. Recorded so a
# case's price is legible before anyone schedules a sweep -- roughly half of it
# is a single solve, and an agent pays that once per attempt.
oracle_wall_sec   = 21
source_type       = "tutorial"
source_channel    = "tutorial-variant"
difficulty_tier   = "M"
gt_type           = "high-fidelity-solver"
release_status    = "public_runnable"
oracle_status     = "available"
runtime_status    = "oracle_calibrated_local_tolerance_study"
score_template    = "numerical"
leakage_risk      = 2
capability_target = "physics"
source_citation   = "Kim, Smith, Lee, Santhanagopalan and Pesaran, J. Electrochem. Soc. 158 (2011) A955 — NCA/graphite cell, distributed with PyBaMM as the NCA_Kim2011 parameter set"
source_url        = "https://github.com/pybamm-team/PyBaMM/blob/main/examples/scripts/rate_capability.py"
tags              = ["battery", "pybamm", "numeric-kpi", "native-reproduction", "ocv-gated"]
prototype_origin  = "pybamm:examples/scripts/rate_capability.py"
prototype_delta   = "The example is not in the image -- the installed PyBaMM package ships no example tree at all, only the parameter sets -- so the collision is with the upstream repository and the rendered documentation page, not with a file the container holds. Moved: the example sweeps one bundled default cell over a ladder of C-rates at a single cut-off voltage, while this case fixes one rate, one ambient temperature, one named parameter set and one cut-off the cell actually reaches, and none of the operating-point numbers is round. Redefined: the example's mean voltage is a time average of the voltage trace, while this case's is the delivered energy divided by the delivered charge -- an energy-weighted mean, a different quantity read off the same trace. Dropped: the sweep itself, and with it the rate-capability and Ragone plots that are the example's whole output. Replaced: the deliverable is the results.csv output interface this benchmark grades, not a plot. Kept, deliberately: the single-step discharge-to-cut-off experiment and the trio of quantities the example reads off it -- delivered charge, delivered energy and a mean discharge voltage. Kept as well: the numerics of PyBaMM's own O'Regan parameter-set notebook -- its var_pts dict, its exponential particle submesh refined toward the particle surface, and its IDAKLU solver -- so the perturbation is in the operating point, not in the numerics."
