schema_version = "1.3"
artifacts = ["/tmp/agent/submission"]

[task]
name        = "hwe-bench/flatplate-zpg-subsonic"
description = "OpenFOAM low-Mach incompressible SST verification of the TMR 2D zero-pressure-gradient flat plate, Re=5e6 per unit length."
authors     = [{name = "SVD AI Lab"}]
keywords    = ["cfd", "rans", "turbulent", "boundary-layer", "2d", "vv", "openfoam"]

[environment]
docker_image    = "sim-benchmark-cfd-fullstack:latest"
cpus            = 2
memory_mb       = 4096
storage_mb      = 10240
gpus            = 0
network_mode    = "public"

[agent]
timeout_sec = 3600
user        = "agent"

[verifier]
timeout_sec      = 2000
user             = "agent"
environment_mode = "separate"

[verifier.environment]
cpus         = 2
memory_mb    = 4096
storage_mb   = 10240
gpus         = 0
# Harbor's Docker Desktop provider cannot use its nftables egress sidecar.
# tests/docker-compose.yaml still gives the verifier container network_mode: none.
network_mode = "public"

[metadata.sim]
task_id           = "flatplate-zpg-subsonic"
solver          = "openfoam"
# Measured cost of producing the reference answer: solution/solve.sh plus the
# evaluator's clean reproduction, one core, on the domain image. Recorded so a
# case's price is legible before anyone schedules a sweep -- roughly half of it
# is a single solve, and an agent pays that once per attempt.
oracle_wall_sec   = 339
source_type     = "vv_standard"
source_channel    = "workshop-vv"
source_citation = "NASA Turbulence Modeling Resource — SST-Vm Expected Results, 2D Zero Pressure Gradient Flat Plate; finest 545x385 CFL3D/FUN3D Cf and integrated-drag results, with documented SST/SST-V/SST-Vm and low-speed comparison guidance."
source_url      = "https://tmbwg.github.io/turbmodels/flatplate_sst.html"
difficulty_tier = "S"
gt_type         = "paper-reported"
range_value     = 0.01
tags            = ["native-openfoam", "field-derived-kpi", "turbulent", "boundary-layer"]
release_status  = "public_runnable"
oracle_status   = "available"
runtime_status  = "oracle_calibrated_local_v2_reproduction"
score_template  = "numerical"
leakage_risk    = 2
capability_target = "physics"
