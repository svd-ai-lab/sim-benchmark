schema_version = "1.3"
artifacts = ["/tmp/agent/submission"]

[task]
name        = "hwe-bench/lid-driven-cavity-ghia-re1000"
description = "Classic 2D lid-driven square cavity at Re=1000, incompressible laminar steady flow (Ghia, Ghia & Shin 1982, J. Comput. Phys. 48:387, Table I). KPI: the minimum normalised x-velocity on the vertical centerline x=0.5, scored against the published Ghia benchmark value (gt = the reference number, NOT the solver's own output)."
authors     = [{name = "SVD AI Lab"}]
keywords    = ["cfd", "laminar", "cavity", "lid-driven", "ghia", "benchmark", "2d", "openfoam", "vv"]

[environment]
docker_image    = "sim-benchmark-cfd-fullstack:latest"
cpus            = 2
memory_mb       = 4096
storage_mb      = 10240
gpus            = 0
network_mode    = "public"

[agent]
timeout_sec = 3600
user        = "agent"

[verifier]
timeout_sec      = 900
user             = "agent"
environment_mode = "separate"

[verifier.environment]
cpus         = 2
memory_mb    = 4096
storage_mb   = 10240
gpus         = 0
# Harbor's Docker Desktop provider cannot use its nftables egress sidecar.
# tests/docker-compose.yaml still gives the verifier container network_mode: none.
network_mode = "public"

[metadata.sim]
task_id           = "lid-driven-cavity-ghia-re1000"
solver            = "openfoam"
# Measured cost of producing the reference answer: solution/solve.sh plus the
# evaluator's clean reproduction, one core, on the domain image. Recorded so a
# case's price is legible before anyone schedules a sweep -- roughly half of it
# is a single solve, and an agent pays that once per attempt.
oracle_wall_sec   = 94
source_type       = "paper"
source_channel    = "paper"
difficulty_tier   = "M"
gt_type           = "paper-reported"
release_status    = "public_runnable"
oracle_status     = "available"
runtime_status    = "oracle_calibrated_local_v2_reproduction"
score_template    = "numerical"
leakage_risk      = 2
capability_target = "physics"
source_citation   = "Ghia, U., Ghia, K. N. and Shin, C. T., 'High-Re Solutions for Incompressible Flow Using the Navier-Stokes Equations and a Multigrid Method,' Journal of Computational Physics, Vol. 48, No. 3, 1982, pp. 387-411. DOI:10.1016/0021-9991(82)90058-4, Table I."
source_url        = "https://doi.org/10.1016/0021-9991(82)90058-4"
tags              = ["native-openfoam", "field-derived-kpi", "laminar", "cavity", "benchmark"]
