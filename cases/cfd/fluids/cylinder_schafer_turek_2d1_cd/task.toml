schema_version = "1.3"
artifacts = ["/tmp/agent/submission"]

[task]
name        = "hwe-bench/cylinder-schafer-turek-2d1-cd"
description = "Schäfer & Turek (1996) DFG benchmark 2D-1: steady laminar incompressible flow around a circular cylinder in a 2.2 m x 0.41 m channel, cylinder D=0.1 m centred at (0.2, 0.2) (offset from the channel centreline), parabolic inlet, Umean=0.2, nu=1e-3 -> Re=20. Quantity of interest is the cylinder drag coefficient cD. gt is the published committee reference cD=5.57953523384 (FeatFlow DFG benchmark 2D-1), NOT the bundled solver output."
authors     = [{name = "SVD AI Lab"}]
keywords    = ["cfd", "laminar", "cylinder", "drag-coefficient", "schafer-turek", "dfg-benchmark", "2d", "vv", "openfoam"]

[environment]
docker_image    = "sim-benchmark-cfd-fullstack:latest"
cpus            = 2
memory_mb       = 4096
storage_mb      = 10240
gpus            = 0
network_mode    = "public"

[agent]
timeout_sec = 3600
user        = "agent"

[verifier]
timeout_sec      = 2100
user             = "agent"
environment_mode = "separate"

[verifier.environment]
cpus         = 2
memory_mb    = 4096
storage_mb   = 10240
gpus         = 0
# Harbor's Docker Desktop provider cannot use its nftables egress sidecar.
# tests/docker-compose.yaml still gives the verifier container network_mode: none.
network_mode = "public"

[metadata.sim]
task_id           = "cylinder-schafer-turek-2d1-cd"
solver            = "openfoam"
# Measured cost of producing the reference answer: solution/solve.sh plus the
# evaluator's clean reproduction, one core, on the domain image. Recorded so a
# case's price is legible before anyone schedules a sweep -- roughly half of it
# is a single solve, and an agent pays that once per attempt.
oracle_wall_sec   = 59
source_type       = "paper"
source_channel    = "paper"
source_citation   = "Schäfer, M. and Turek, S. (with Durst, F., Krause, E., Rannacher, R.), 'Benchmark Computations of Laminar Flow Around a Cylinder', in Flow Simulation with High-Performance Computers II, Notes on Numerical Fluid Mechanics, Vol. 48, pp. 547-566, Vieweg (1996). DOI:10.1007/978-3-322-89849-4_39, test case 2D-1."
source_url        = "https://doi.org/10.1007/978-3-322-89849-4_39"
difficulty_tier   = "M"
gt_type           = "paper-reported"
release_status    = "public_runnable"
oracle_status     = "available"
runtime_status    = "oracle_calibrated_local_v2_reproduction"
score_template    = "numerical"
leakage_risk      = 2
capability_target = "physics"
tags              = ["native-openfoam", "field-derived-kpi", "drag-coefficient", "wall-bounded", "laminar"]
