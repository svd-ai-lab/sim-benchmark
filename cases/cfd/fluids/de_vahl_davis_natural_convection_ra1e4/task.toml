schema_version = "1.3"
artifacts = ["/tmp/agent/submission"]

[task]
name        = "hwe-bench/de-vahl-davis-natural-convection-ra1e4"
description = "Buoyancy-driven natural convection in a 2D differentially heated square cavity at Ra=1e4 and Pr=0.71. The KPI is the average Nusselt number on the hot wall."
authors     = [{name = "SVD AI Lab"}]
keywords    = ["cfd", "laminar", "natural-convection", "buoyancy", "boussinesq", "cavity", "de-vahl-davis", "nusselt", "benchmark", "2d", "openfoam", "vv"]

[environment]
docker_image    = "sim-benchmark-cfd-fullstack:latest"
cpus            = 2
memory_mb       = 4096
storage_mb      = 10240
gpus            = 0
network_mode    = "public"

[agent]
timeout_sec = 3600
user        = "agent"

[verifier]
timeout_sec      = 900
user             = "agent"
environment_mode = "separate"

[verifier.environment]
cpus         = 2
memory_mb    = 4096
storage_mb   = 10240
gpus         = 0
# Harbor's Docker Desktop provider cannot use its nftables egress sidecar.
# tests/docker-compose.yaml still gives the verifier container network_mode: none.
network_mode = "public"

[metadata.sim]
task_id           = "de-vahl-davis-natural-convection-ra1e4"
solver            = "openfoam"
# Measured cost of producing the reference answer: solution/solve.sh plus the
# evaluator's clean reproduction, one core, on the domain image. Recorded so a
# case's price is legible before anyone schedules a sweep -- roughly half of it
# is a single solve, and an agent pays that once per attempt.
oracle_wall_sec   = 53
source_type       = "paper"
source_channel    = "paper"
difficulty_tier   = "L"
gt_type           = "paper-reported"
release_status    = "public_runnable"
oracle_status     = "available"
runtime_status    = "oracle_calibrated_local_v2_reproduction"
score_template    = "numerical"
leakage_risk      = 2
capability_target = "physics"
source_citation   = "de Vahl Davis, G., 'Natural convection of air in a square cavity: A bench mark numerical solution,' International Journal for Numerical Methods in Fluids, Vol. 3, No. 3, 1983, pp. 249-264. DOI:10.1002/fld.1650030305, Table V."
source_url        = "https://doi.org/10.1002/fld.1650030305"
tags              = ["native-openfoam", "field-derived-kpi", "laminar", "natural-convection", "boussinesq", "cavity", "benchmark"]
