schema_version = "1.3"
artifacts = ["/tmp/agent/submission"]

[task]
name        = "hwe-bench/ch4-air-flame-speed-meet-resolution-spec"
description = "A working methane/air flame-speed setup that does not meet the resolution requirement the task states. Bring it up to that requirement and report the burning velocity that comes out of the setup that does, with the resolution table the requirement is judged on."
authors     = [{name = "SVD AI Lab"}]
keywords    = ["combustion", "cantera", "chemical-kinetics", "methane", "laminar-flame-speed", "grid-independence", "design-to-spec"]

[environment]
docker_image    = "sim-benchmark-combustion-fullstack:latest"
cpus            = 2
memory_mb       = 4096
storage_mb      = 4096
gpus            = 0
network_mode    = "public"

[agent]
timeout_sec = 1800
user        = "agent"

[verifier]
timeout_sec      = 1020
user             = "agent"
environment_mode = "separate"

[verifier.environment]
cpus         = 2
memory_mb    = 4096
storage_mb   = 4096
gpus         = 0
# Harbor's Docker Desktop provider cannot use its nftables egress sidecar.
# tests/docker-compose.yaml still gives the verifier container network_mode: none.
network_mode = "public"

[metadata.sim]
task_id           = "ch4-air-flame-speed-meet-resolution-spec"
solver            = "cantera"
# Measured cost of producing the reference answer at the `cpus = 2` this case
# declares: solution/solve.sh 66 s plus the evaluator's clean reproduction 68 s.
# Six times the sibling's 21 s, because the contract asks for a ladder and a
# ladder is four solves -- that is the price of the shape, and it is recorded
# here so it is legible before anyone schedules a sweep. Two consequences worth
# reading together: the evaluator's re-run fills 7.3% of `reproduction_timeout_s`,
# so the cost criterion has room; but the margin against `[agent].timeout_sec`
# falls from the sibling's ~86x to ~13x, which is the lowest in this track and
# is stated rather than fixed -- raising a budget is a human decision, and the
# only legitimate reason for it is a measurement like this one, never a model
# having timed out.
oracle_wall_sec   = 134
source_type       = "forum"
source_channel    = "forum"
difficulty_tier   = "M"
gt_type           = "high-fidelity-solver"
release_status    = "public_runnable"
oracle_status     = "available"
runtime_status    = "oracle_calibrated_local_tolerance_study"
score_template    = "numerical"
leakage_risk      = 2
capability_target = "numerical"
source_citation   = "Cantera users group, two threads four years apart, both with a maintainer answer: a freely-propagating flame whose reported speed depends on free numerical choices the user makes rather than on the physics -- domain length and adaptive-refinement policy -- with nothing erroring and the solver reporting success. The chemistry is GRI-Mech 3.0 (Smith, Golden, Frenklach et al.), the mechanism distributed with Cantera as gri30.yaml."
source_url        = "https://groups.google.com/g/cantera-users/c/wiRsvid7cCk"
tags              = ["combustion", "cantera", "numeric-kpi", "native-reproduction", "design-to-spec", "resolution-gate"]
prototype_origin  = "sim-benchmark:cases/combustion/flames/ch4_air_flame_speed_phi1p07_1p2atm_312k"
prototype_delta   = "Same mixture, same operating point, same mechanism, same transport model, same image, same solver, same evaluator, and gt_value / pass_tol / gross_error_tol inherited verbatim from the sibling named above -- deliberately, because the pair is the experiment #257 step 4 left open: one asks for the value, the other asks for the value plus the demonstration that it has stopped moving, and only a matched pair can say whether changing the task SHAPE buys discrimination or only inventory. What moved is the contract, in three places. (1) The agent is handed a WORKING setup that does not meet the stated requirement, instead of a blank directory -- the shape is design-to-spec, not solve-from-nothing, and the requirement is announced rather than hidden, so there is no defect to diagnose. (2) The deliverable grows a second output-interface file, grid_independence.csv, whose four predicates are stated verbatim in instruction.md and checked as a gate: at least 3 levels, finest at least 2x the coarsest, each of the last two steps within 2%, reported answer within 2% of the finest level. (3) The sibling's instruction already asks for a grid-converged speed and scores only the number, so that sentence enforces nothing; here it is the thing being checked. The handed-over setup uses Cantera's own library-default refinement (ratio 10, slope 0.8, curve 0.8), which at this operating point lands +11.97% -- 2.4x outside the band -- so the scored number is not reachable without doing the work. What did NOT move: the domain width the sibling ships, because it is measured inert here (0.005 to 0.06 m spans 0.23% at converged refinement), which is why this case asks for resolution independence and not the domain independence its demand record also expects; that half needs a near-autoignitive inlet temperature, which is a different operating point and therefore a different case."
