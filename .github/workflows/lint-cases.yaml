name: Validate dataset

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Workflow files load
        run: uv run --with pyyaml python .github/validate_workflows.py

      - name: Task schema
        run: uv run python tools/lint_case.py cases/[!_]*/*/*/

      - name: Verifier tests
        run: >-
          uv run --project lib/sim_benchmark_verifier
          --with pytest --with numpy --with scipy --with pandas
          python -m pytest -q lib/sim_benchmark_verifier/tests

      - name: New tasks use the current schema
        if: ${{ github.event_name == 'pull_request' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          added=$(git diff --diff-filter=A --name-only "$BASE_SHA"...HEAD -- 'cases/*/*/*/task.toml' | xargs -r -n1 dirname | tr '\n' ' ')
          if [ -n "$added" ]; then
            uv run python tools/lint_case.py --require-current-schema $added
          fi
